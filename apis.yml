name: FlyFin
description: 'FlyFin is an AI-powered tax preparation and filing platform for freelancers, self-employed
  individuals, 1099 contractors, sole proprietorships, LLCs, S-Corps, C-Corps, partnerships, and W-2
  employees. It pairs an A.I. deduction scanner that connects to 2,000+ financial institutions through
  Plaid with a team of certified CPAs who prepare and file federal and state returns. The product suite
  includes a quarterly tax calculator, a CPA-certified AI tax assistant for unlimited questions, audit
  insurance with IRS representation, and Excel tax-summary exports. FlyFin operates as a consumer mobile
  and web application (iOS and Android) and does not publish a public developer API. It was surfaced as
  a portfolio company of Accel and added to the API Evangelist network for enrichment.'
